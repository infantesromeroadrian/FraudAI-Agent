name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runtime base image used by the Dockerfiles (python 3.11.18, multi-platform index digest).
  PY_BASE_IMAGE: python:3.11.18-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39
  # Never re-resolve: every uv sync/run must use exactly what uv.lock pins.
  UV_FROZEN: "1"
  # Ephemeral CI-only tags; images are never pushed to any registry.
  API_IMAGE: fraudai-agent:ci
  SANDBOX_IMAGE: fraudai-sandbox:ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # openai extra: claude_invoker lazily imports langchain_openai
      - run: uv sync --frozen --extra dev --extra openai
      # Strict mode and per-module exceptions live in pyproject.toml [tool.mypy]
      - run: uv run mypy src/fraudai/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run python -m pytest tests/ -q --ignore=tests/test_smoke_live.py --cov=fraudai --cov-report=xml --cov-fail-under=80
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        if: always()
        with:
          file: coverage.xml

  # Same uv.lock, executed on the exact interpreter the runtime images ship (3.11.18).
  # Native jobs above use .python-version (3.11.16, uv-managed).
  test-py311-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Write container test script
        run: |
          cat > "$RUNNER_TEMP/verify.sh" <<'SCRIPT'
          set -euo pipefail
          pip install --quiet uv==0.12.19
          cp -r /src /work && cd /work
          # Use the container interpreter, never download another one, never re-resolve.
          export UV_FROZEN=1 UV_PYTHON_DOWNLOADS=never UV_PYTHON=/usr/local/bin/python \
                 UV_PROJECT_ENVIRONMENT=/opt/venv-test
          python -V
          python -c "import sys; assert sys.version_info[:3] == (3, 11, 18), sys.version"
          uv sync --extra dev
          uv run python -m pytest tests/ -q --ignore=tests/test_smoke_live.py -m "not docker" --cov=fraudai --cov-report=term --cov-fail-under=80
          SCRIPT
      - name: pytest in python:3.11.18 container (frozen lock)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/verify.sh:/verify.sh:ro" "$PY_BASE_IMAGE" bash /verify.sh

  docker:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, test-py311-18]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t "$API_IMAGE" .
      - run: docker build -t "$SANDBOX_IMAGE" src/fraudai/tools/sandbox_image/
      # The runtime image must contain the installed package (non-editable) and
      # import cleanly with no secrets and no network/LLM access.
      - name: Smoke import API image
        run: docker run --rm --network none "$API_IMAGE" python -c "import fraudai.api.app as m; print(m.__file__)"
      # Trivy: vulnerability scan only (`scanners: vuln` -> TRIVY_SCANNERS). Trivy's default
      # also runs the secret scanner, which flags documentation examples such as
      # `{"type": "service_account"}` inside the anthropic SDK docstrings as CRITICAL
      # "gcp-service-account" (false positives). Image layers are therefore NOT scanned
      # for secrets; the TruffleHog job in security.yml covers verified secrets in the
      # repository/history only, a different scope.
      # Trivy: reports are always produced (artifact), then the gate fails on
      # HIGH/CRITICAL findings that already have a fix available.
      - name: Trivy report (API image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          format: table
          output: trivy-api.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Trivy report (sandbox image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SANDBOX_IMAGE }}
          format: table
          output: trivy-sandbox.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-reports
          path: trivy-*.txt
          if-no-files-found: error
      - name: Trivy gate (API image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy gate (sandbox image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SANDBOX_IMAGE }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ADR-007 / F3.5: the sandbox controls are proven against a real Docker daemon.
  # FRAUDAI_DOCKER_TESTS=1 makes a missing daemon or image a hard failure
  # instead of a silent skip. The image is built locally, never pushed.
  docker-integration:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    env:
      FRAUDAI_DOCKER_TESTS: "1"
      FRAUDAI_SANDBOX_IMAGE: fraudai-sandbox:ci-integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: docker build -t "$FRAUDAI_SANDBOX_IMAGE" src/fraudai/tools/sandbox_image/
      - run: uv run pytest tests/integration -m docker -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # pnpm version comes from frontend/package.json "packageManager" (9.15.9)
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm lint
      - run: cd frontend && pnpm type-check
      - run: cd frontend && pnpm build
