[project]
name = "fraudai-agent"
version = "0.1.0"
description = "AI agentic platform for banking fraud detection and AI red teaming in FinTech"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
    { name = "Adrian Infantes" },
]
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "qdrant-client>=1.13",
    "sentence-transformers>=3.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "networkx>=3.4",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "beautifulsoup4>=4.12",
    "docker>=7.0",
    "prometheus-client>=0.21",
    "langchain-groq>=1.1.2",
    "PyJWT>=2.9",
    "aiosqlite>=0.20",
    # Direct pin of the transitive torch (via sentence-transformers) so that
    # [tool.uv.sources] can route Linux to the CPU-only wheel index.
    "torch>=2.0",
]

[project.optional-dependencies]
# Optional OpenAI backend used by agents/claude_invoker.py (lazy import).
openai = [
    "langchain-openai>=0.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudai"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# B008: Depends() in defaults is idiomatic FastAPI dependency injection.
"src/fraudai/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
# Source files carry legacy `# type: ignore[...]` comments that become "unused"
# depending on installed extras (e.g. langchain-groq / langchain-openai typing).
# Source edits are out of scope for F2; this mirrors the previous CI flag
# (--no-warn-unused-ignores) but is declared here, not on the command line.
warn_unused_ignores = false

# Explicit, per-module exceptions for third-party packages that ship neither
# type hints nor a stub package. NO global ignore_missing_imports.
[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
# types-docker is obsolete (docker SDK has no py.typed); untyped import only.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
# scikit-learn ships no py.typed marker nor stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["FlagEmbedding"]
# Optional, lazily imported reranker/embedder; not a project dependency.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

# Linux (CI / Docker) installs CPU-only torch: the default PyPI Linux wheel
# drags ~3 GB of nvidia-*/triton CUDA packages (10 GB image) that no code path
# here uses. macOS keeps the PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
