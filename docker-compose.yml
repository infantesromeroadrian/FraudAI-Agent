# Development services. The API and the frontend run on the host (uv / pnpm).
#
# The LLM is the Ollama daemon already running on the host (authenticated for cloud
# models, D2); this file does NOT start a second, empty one by default. The container
# below exists only for hosts without Ollama and starts with:
#     docker compose --profile ollama-container up
# on its own loopback port, so it never collides with the host daemon on 11434.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 2g
    healthcheck:
      # The qdrant image ships neither curl nor wget: probe /healthz over a TCP socket.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ollama:
    profiles: ["ollama-container"]
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
