# =============================================================================
# Prometheus Configuration — FraudAI Agent (local compose)
#
# Scrape targets (only things that really expose Prometheus metrics):
#   - fraudai:    application metrics (dedicated scrape credential, metrics-only)
#   - qdrant:     vector database metrics
#   - prometheus: self-monitoring
# Ollama is NOT scraped: the daemon does not expose a Prometheus endpoint. Its
# availability is reported by the API health endpoint, not by this file.
#
# Alert rules are loaded from /etc/prometheus/rules/*.yml and evaluated here.
# There is NO Alertmanager in this stack: alerts are visible in the Prometheus UI
# (Alerts tab) but nothing is notified. Add an `alerting:` block only together with
# a real Alertmanager deployment.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- FraudAI Application ---
  - job_name: fraudai
    metrics_path: /api/v1/admin/metrics
    scheme: http
    static_configs:
      - targets: ["fraudai:8000"]
        labels:
          environment: local
    # The dedicated metrics-only credential (F5c), mounted as a compose secret file.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/fraudai_metrics_token

  # --- Qdrant Vector Database ---
  - job_name: qdrant
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["qdrant:6333"]
        labels:
          environment: local

  # --- Prometheus Self-Monitoring ---
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
