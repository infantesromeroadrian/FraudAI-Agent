# =============================================================================
# FraudAI Agent — Prometheus Alert Rules
#
# Thresholds derived from F2 Spec SLAs (docs/F2_spec.md)
# Runbook references point to docs/F6_runbook.md
#
# EVERY expression below uses a metric that the application or the scrape itself
# really produces (fraudai_* from src/fraudai/core/metrics.py, and `up`). Nothing here
# depends on node_exporter, GPU exporters, an Alertmanager or invented metrics;
# scripts/check-rules.sh enforces that. These alerts are evaluated by Prometheus
# only: no Alertmanager is deployed, so nothing is notified.
#
# Naming: FraudAI<Component><Condition>
# =============================================================================

groups:
  # ---------------------------------------------------------------------------
  # SLA Compliance Alerts
  # ---------------------------------------------------------------------------
  - name: fraudai_sla
    rules:
      # --- Donna Routing Latency ---
      # F2 SLA: Donna P95 < 1.5s, P99 < 3s, timeout 5s
      - alert: DonnaRoutingLatencyHigh
        expr: >
          histogram_quantile(0.95,
            sum(rate(fraudai_agent_duration_seconds_bucket{agent_name="donna"}[5m])) by (le)
          ) > 1.5
        for: 5m
        labels:
          severity: warning
          component: donna
        annotations:
          summary: "Donna routing latency P95 exceeds SLA (1.5s)"
          description: >
            Donna P95 latency is {{ $value | humanizeDuration }} over the last 5m.
            SLA target: < 1.5s (F2 spec section 5.1).
          runbook: "docs/F6_runbook.md#22-ollama-oom-out-of-memory--vram"

      - alert: DonnaRoutingLatencyCritical
        expr: >
          histogram_quantile(0.99,
            sum(rate(fraudai_agent_duration_seconds_bucket{agent_name="donna"}[5m])) by (le)
          ) > 3
        for: 3m
        labels:
          severity: critical
          component: donna
        annotations:
          summary: "Donna routing latency P99 exceeds critical threshold (3s)"
          description: >
            Donna P99 latency is {{ $value | humanizeDuration }}.
            P99 SLA: < 3s, timeout: 5s. Ollama may be overloaded or OOM.
          runbook: "docs/F6_runbook.md#22-ollama-oom-out-of-memory--vram"

      # --- Agent Response Latency ---
      # F2 SLA: First response P95 < 5s, complete response P95 < 10s
      - alert: AgentResponseLatencyHigh
        expr: >
          histogram_quantile(0.95,
            sum(rate(fraudai_agent_duration_seconds_bucket{agent_name!="donna"}[5m])) by (le, agent_name)
          ) > 5
        for: 5m
        labels:
          severity: warning
          component: agents
        annotations:
          summary: "Agent {{ $labels.agent_name }} first response P95 exceeds SLA (5s)"
          description: >
            Agent {{ $labels.agent_name }} P95 first response latency is {{ $value | humanizeDuration }}.
            SLA target: < 5s (F2 spec section 5.1).
          runbook: "docs/F6_runbook.md#23-claude-api-rate-limited"

      - alert: AgentResponseLatencyCritical
        expr: >
          histogram_quantile(0.95,
            sum(rate(fraudai_agent_duration_seconds_bucket{agent_name!="donna"}[5m])) by (le, agent_name)
          ) > 10
        for: 3m
        labels:
          severity: critical
          component: agents
        annotations:
          summary: "Agent {{ $labels.agent_name }} complete response P95 exceeds SLA (10s)"
          description: >
            Agent {{ $labels.agent_name }} P95 streaming latency is {{ $value | humanizeDuration }}.
            SLA target: < 10s complete response (F2 spec section 5.1).
          runbook: "docs/F6_runbook.md#23-claude-api-rate-limited"

      # --- RAG Retrieval Latency ---
      # F2 SLA: Retrieval P95 < 200ms
      - alert: RAGRetrievalLatencyHigh
        expr: >
          histogram_quantile(0.95,
            sum(rate(fraudai_retrieval_duration_seconds_bucket[5m])) by (le)
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          component: rag
        annotations:
          summary: "RAG retrieval latency P95 exceeds SLA (200ms)"
          description: >
            RAG search P95 is {{ $value | humanizeDuration }}.
            SLA target: < 200ms (F2 spec section 2.1).
          runbook: "docs/F6_runbook.md#21-qdrant-no-arranca"

      - alert: RAGRetrievalLatencyCritical
        expr: >
          histogram_quantile(0.95,
            sum(rate(fraudai_retrieval_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 3m
        labels:
          severity: critical
          component: rag
        annotations:
          summary: "RAG retrieval latency P95 exceeds critical threshold (500ms)"
          description: >
            RAG search P95 is {{ $value | humanizeDuration }}.
            P99 SLA: 500ms, timeout: 2s. Qdrant may be degraded.
          runbook: "docs/F6_runbook.md#21-qdrant-no-arranca"

  # ---------------------------------------------------------------------------
  # Error Rate Alerts
  # ---------------------------------------------------------------------------
  - name: fraudai_errors
    rules:
      # --- HTTP Error Rate ---
      # F2 SLA: Error rate < 2%
      - alert: HighErrorRate
        expr: >
          (
            sum(rate(fraudai_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(fraudai_requests_total[5m]))
          ) > 0.02
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "HTTP 5xx error rate exceeds SLA (2%)"
          description: >
            Error rate is {{ $value | humanizePercentage }} over the last 5m.
            SLA target: < 2% (F2 spec section 2.4).
          runbook: "docs/F6_runbook.md#26-la-aplicacion-no-arranca"

      - alert: CriticalErrorRate
        expr: >
          (
            sum(rate(fraudai_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(fraudai_requests_total[5m]))
          ) > 0.05
        for: 3m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "HTTP 5xx error rate exceeds critical threshold (5%)"
          description: >
            Error rate is {{ $value | humanizePercentage }}.
            Immediate investigation required. Check application logs and dependent services.
          runbook: "docs/F6_runbook.md#26-la-aplicacion-no-arranca"

      # --- Our own API answering 429 (fraudai_requests_total counts responses of THIS API;
      # it does not observe upstream LLM providers) ---
      - alert: APIRateLimitResponses
        expr: >
          sum(rate(fraudai_requests_total{status_code="429"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          component: claude_api
        annotations:
          summary: "The API is answering HTTP 429"
          description: >
            Clients are being rate limited by this API (fraudai_requests_total, status_code=429).
            This metric does not observe upstream LLM provider errors.
          runbook: "docs/F6_runbook.md#23-claude-api-rate-limited"

  # ---------------------------------------------------------------------------
  # Sandbox Alerts
  # ---------------------------------------------------------------------------
  - name: fraudai_sandbox
    rules:
      # --- Sandbox Timeout Rate ---
      # Sandbox timeout > 10% indicates resource starvation or runaway code
      - alert: SandboxTimeoutRateHigh
        expr: >
          (
            sum(rate(fraudai_sandbox_executions_total{status="timeout"}[15m]))
            /
            sum(rate(fraudai_sandbox_executions_total[15m]))
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          component: sandbox
        annotations:
          summary: "Sandbox timeout rate exceeds 10%"
          description: >
            {{ $value | humanizePercentage }} of sandbox executions are timing out.
            Possible causes: CPU contention, large datasets, or runaway code.
          runbook: "docs/F6_runbook.md#24-sandbox-container-no-se-limpia"

      # --- Sandbox Failure Rate ---
      - alert: SandboxFailureRateHigh
        expr: >
          (
            sum(rate(fraudai_sandbox_executions_total{status=~"error|timeout"}[15m]))
            /
            sum(rate(fraudai_sandbox_executions_total[15m]))
          ) > 0.2
        for: 10m
        labels:
          severity: critical
          component: sandbox
        annotations:
          summary: "Sandbox failure rate exceeds 20%"
          description: >
            {{ $value | humanizePercentage }} of sandbox executions are failing.
            Tools (Harvey analysis, Mike red team, Rachel pipelines) severely impacted.
          runbook: "docs/F6_runbook.md#24-sandbox-container-no-se-limpia"

  # ---------------------------------------------------------------------------
  # Availability Alerts
  # ---------------------------------------------------------------------------
  - name: fraudai_availability
    rules:
      # --- Service Down ---
      # F2 SLA: Uptime >= 99%
      - alert: FraudAIDown
        expr: up{job="fraudai"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "FraudAI service is down"
          description: >
            Prometheus cannot scrape FraudAI for > 1 minute.
            Uptime SLA: >= 99% during business hours.
          runbook: "docs/F6_runbook.md#26-la-aplicacion-no-arranca"

      # --- Qdrant Down ---
      - alert: QdrantDown
        expr: up{job="qdrant"} == 0
        for: 1m
        labels:
          severity: critical
          component: qdrant
        annotations:
          summary: "Qdrant vector database is down"
          description: >
            Prometheus cannot scrape Qdrant. RAG queries (Louis, Harvey RAG) will fail.
            App runs in degraded mode without Qdrant.
          runbook: "docs/F6_runbook.md#21-qdrant-no-arranca"
